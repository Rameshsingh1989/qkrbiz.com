# ═══════════════════════════════════════════════════════════════════════════
# Nginx site config for qkrbiz SSR (Node listens on 127.0.0.1:3000).
# INSTALL: copy to /etc/nginx/sites-available/qkrbiz.conf and symlink into
#          sites-enabled, OR merge the `location` blocks below into your
#          existing server {} if you already have one (keep your real TLS
#          cert paths — the ssl_certificate lines here are placeholders).
#
#   sudo ln -s /etc/nginx/sites-available/qkrbiz.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Requires the proxy_cache_path from 00-qkrbiz-cache.conf (see that file).
# ═══════════════════════════════════════════════════════════════════════════

# Reusable upstream so timeouts/keepalive live in one place.
upstream qkrbiz_ssr {
    server 127.0.0.1:3000;
    keepalive 32;               # reuse connections to Node (lower latency)
}

# ── HTTP → HTTPS + non-www → www redirect ──────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name qkrbiz.com www.qkrbiz.com;
    return 301 https://www.qkrbiz.com$request_uri;
}

# ── non-www HTTPS → www HTTPS ──────────────────────────────────────────────
server {
    # `listen ... ssl http2` form works on all supported Nginx. (On 1.25.1+
    # you may instead use `listen 443 ssl;` + `http2 on;` — but the older form
    # is universally compatible and only warns on the newest builds.)
    listen 443 ssl http2;
    server_name qkrbiz.com;

    ssl_certificate     /etc/letsencrypt/live/qkrbiz.com/fullchain.pem;   # ← your cert
    ssl_certificate_key /etc/letsencrypt/live/qkrbiz.com/privkey.pem;     # ← your key

    return 301 https://www.qkrbiz.com$request_uri;
}

# ── Main site (www, HTTPS) ─────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name www.qkrbiz.com;

    ssl_certificate     /etc/letsencrypt/live/qkrbiz.com/fullchain.pem;   # ← your cert
    ssl_certificate_key /etc/letsencrypt/live/qkrbiz.com/privkey.pem;     # ← your key

    # Let Node handle gzip (it already runs `compression`); avoids double work.
    gzip off;

    # ── Shared proxy settings ──────────────────────────────────────────────
    # X-Forwarded-Proto is REQUIRED: server.js's canonical-redirect middleware
    # relies on it to know the client used https (the Node<->Nginx hop is plain
    # http). Without it you risk redirect loops. See server.js comments.
    proxy_http_version 1.1;
    proxy_set_header Connection "";                 # enable upstream keepalive
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_read_timeout 30s;

    # ── The cache ──────────────────────────────────────────────────────────
    proxy_cache qkrbiz_cache;

    # Key by pathname only (no query string). The SSR render is query-
    # independent — server.js/entry-server.jsx derive everything from
    # url.split("?")[0] and the app-level HTML cache keys the same way — so
    # utm/gclid variants correctly share one edge entry. If you ever add a
    # route whose HTML depends on the query string, switch this to
    # "$scheme://$host$request_uri".
    proxy_cache_key "$scheme://$host$uri";

    # Honor the origin's Cache-Control. The app sends HTML with
    # `s-maxage=300, stale-while-revalidate=60`, so Nginx caches HTML ~5 min
    # at the edge while the browser (max-age=0) always revalidates. Assets/
    # fonts carry max-age=31536000 and get cached long. Tune HTML TTL from the
    # app via HTML_CACHE_TTL_MS — no Nginx change needed.
    #
    # Fallback TTLs for any response that arrives WITHOUT Cache-Control
    # (e.g. the RSS route). Origin Cache-Control always takes precedence.
    proxy_cache_valid 200 301 302 5m;
    proxy_cache_valid 404 1m;

    # Collapse a stampede of concurrent misses for the same key into ONE
    # origin request; the rest wait for it to populate the cache.
    proxy_cache_lock on;
    proxy_cache_lock_timeout 10s;

    # stale-while-revalidate at the edge: serve the stale copy instantly and
    # refresh it in the background, and keep serving stale if Node errors/is
    # down — so a slow or crashed render never becomes a slow page.
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_cache_revalidate on;                       # use If-Modified-Since/ETag

    # Never serve a cached page to (or cache a response for) an authenticated
    # request, or when ?nocache=1 is passed for debugging. Responses that set
    # a cookie are auto-excluded by Nginx.
    proxy_cache_bypass $http_authorization $arg_nocache;
    proxy_no_cache     $http_authorization $arg_nocache;

    # Expose HIT/MISS/EXPIRED/UPDATING for debugging: `curl -I` and read it.
    # Pair it with the app's own X-HTML-Cache header (HIT = app memory cache).
    add_header X-Cache-Status $upstream_cache_status always;

    # ── Everything → SSR / static, cached per the settings above ───────────
    # A single location keeps caching correct for all response types: Nginx
    # honors each upstream's Cache-Control, so hashed /assets & /fonts (Node
    # sets max-age=31536000 immutable) cache long, while HTML caches ~5 min
    # via s-maxage. No duplicate headers, no per-path special-casing.
    location / {
        proxy_pass http://qkrbiz_ssr;
    }
}
