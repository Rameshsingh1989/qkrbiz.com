# ─────────────────────────────────────────────────────────────────────────
# Nginx proxy_cache zone for qkrbiz SSR.
# INSTALL: copy to /etc/nginx/conf.d/00-qkrbiz-cache.conf
#   (files in conf.d are included inside the http {} block, which is where
#    proxy_cache_path MUST live — it is not valid inside server {}.)
#
# Then create the cache dir once and reload:
#   sudo mkdir -p /var/cache/nginx/qkrbiz && sudo chown -R nginx:nginx /var/cache/nginx/qkrbiz
#   sudo nginx -t && sudo systemctl reload nginx
#
#   keys_zone   : 20m of shared memory for cache keys/metadata (~160k entries)
#   max_size    : cap on-disk cache at 1 GB (LRU eviction beyond this)
#   inactive    : drop entries not requested for 30m regardless of TTL
#   use_temp_path=off : write straight into the cache dir (avoids an extra copy)
# ─────────────────────────────────────────────────────────────────────────
proxy_cache_path /var/cache/nginx/qkrbiz
    levels=1:2
    keys_zone=qkrbiz_cache:20m
    max_size=1g
    inactive=30m
    use_temp_path=off;
